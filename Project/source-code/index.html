<!DOCTYPE html>
<html>
<head>
    <title>RAG Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
        }
        .content {
            padding: 40px;
        }
        .section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #f0f4ff;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-label {
            color: #667eea;
            font-weight: 500;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        #answer {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
            color: #333;
            border-left: 4px solid #764ba2;
            min-height: 60px;
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 RAG Application</h1>
            <p>Upload documents and ask questions using AI</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>📄 Upload Document</h2>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept=".pdf,.docx" onchange="handleFileSelect()">
                    <div class="upload-label" id="uploadLabel">Click to select PDF or DOCX file</div>
                </div>
                <button onclick="uploadDocument()">Upload & Process</button>
                <div id="uploadStatus"></div>
            </div>
            
            <div class="section">
                <h2>❓ Ask Question</h2>
                <select id="providerSelect">
                    <option value="openrouter">OpenRouter</option>
                    <option value="groq">Groq</option>
                </select>
                <input type="text" id="queryInput" placeholder="Enter your question here...">
                <button onclick="queryRAG()">Get Answer</button>
                <div id="answer"></div>
            </div>
        </div>
    </div>

    <script>
        function handleFileSelect() {
            const fileInput = document.getElementById('fileInput');
            const label = document.getElementById('uploadLabel');
            if (fileInput.files[0]) {
                label.textContent = fileInput.files[0].name;
            }
        }

        async function uploadDocument() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            
            if (!fileInput.files[0]) {
                status.innerHTML = '<div class="status error">Please select a file first</div>';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            status.innerHTML = '<div class="status"><span class="loading"></span>Uploading and processing...</div>';
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                status.innerHTML = `<div class="status success">✓ ${result.message}</div>`;
            } catch (error) {
                status.innerHTML = '<div class="status error">✗ Error uploading file</div>';
            }
        }
        
        async function queryRAG() {
            const queryInput = document.getElementById('queryInput');
            const providerSelect = document.getElementById('providerSelect');
            const answerDiv = document.getElementById('answer');
            
            if (!queryInput.value) {
                answerDiv.innerHTML = '<div class="status error">Please enter a question</div>';
                return;
            }
            
            answerDiv.innerHTML = '<div class="status"><span class="loading"></span>Processing your question...</div>';
            
            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        query: queryInput.value,
                        provider: providerSelect.value
                    })
                });
                const result = await response.json();
                answerDiv.textContent = result.answer;
            } catch (error) {
                answerDiv.innerHTML = '<div class="status error">✗ Error processing query</div>';
            }
        }

        // Allow Enter key to submit query
        document.getElementById('queryInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                queryRAG();
            }
        });
    </script>
</body>
</html>
