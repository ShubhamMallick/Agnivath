<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1), transparent),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.1), transparent),
                radial-gradient(circle at 40% 80%, rgba(239, 68, 68, 0.05), transparent);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        
        .header p {
            opacity: 0.7;
            font-size: 0.9em;
            font-weight: 300;
        }
        
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 950px;
            width: 95%;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        
        .upload-section {
            padding: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .upload-section h3 {
            margin-bottom: 15px;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .upload-section h3::before {
            content: '';
            width: 3px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }
        
        .upload-area {
            border: 2px dashed rgba(102, 126, 234, 0.5);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.5s ease;
        }
        
        .upload-area:hover::before {
            left: 100%;
        }
        
        .upload-area:hover {
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(102, 126, 234, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .upload-controls button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .upload-controls button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .upload-controls button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .upload-controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        #uploadStatus {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: transparent;
            scroll-behavior: smooth;
        }
        
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 3px;
        }
        
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.7);
        }
        
        .message {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.4s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            align-items: flex-end;
        }
        
        .message.assistant {
            align-items: flex-start;
        }
        
        .message-content {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 20px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        
        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 6px;
        }
        
        .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .message-content th, .message-content td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            text-align: left;
        }
        
        .message-content th {
            background: rgba(102, 126, 234, 0.3);
            color: white;
            font-weight: 600;
        }
        
        .message-content tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.03);
        }
        
        .message-content ul, .message-content ol {
            margin: 12px 0;
            padding-left: 25px;
        }
        
        .message-content li {
            margin: 6px 0;
        }
        
        .message-content h1, .message-content h2, .message-content h3 {
            margin: 15px 0 10px 0;
            font-size: 1.2em;
            color: #667eea;
        }
        
        .message-content p {
            margin: 10px 0;
        }
        
        .message-content strong {
            color: #a78bfa;
        }
        
        .message-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .input-section {
            padding: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .input-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .input-controls select {
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            min-width: 140px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .input-controls select:hover {
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .input-controls select option {
            background: #1a1a2e;
            color: white;
        }
        
        .input-controls input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.3s ease;
        }
        
        .input-controls input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }
        
        .input-controls input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .input-controls button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .input-controls button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .input-controls button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .input-controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .input-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .input-controls button:disabled:hover {
            box-shadow: none;
        }
        
        .typing-indicator {
            font-style: italic;
            color: rgba(255, 255, 255, 0.6);
            margin-left: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeInUp 0.3s ease;
        }
        
        .typing-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
        
        .success {
            color: #4ade80;
        }
        
        .error {
            color: #f87171;
        }
        
        /* Floating action button for mobile */
        @media (max-width: 768px) {
            .main-container {
                width: 100%;
                margin: 10px;
                border-radius: 16px;
            }
            
            .message-content {
                max-width: 85%;
            }
            
            .input-controls {
                flex-wrap: wrap;
            }
            
            .input-controls select {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ RAG Chat Assistant</h1>
        <p>Upload documents and unlock knowledge with AI</p>
    </div>
    
    <div class="main-container">
        <div class="upload-section">
            <h3>📄 Upload Document</h3>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept=".pdf,.docx" onchange="updateFileName()">
                <div id="uploadLabel">Click to select PDF or DOCX file</div>
            </div>
            <div class="upload-controls">
                <button onclick="uploadDocument()">Upload & Process</button>
                <span id="uploadStatus"></span>
            </div>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-content">
                    👋 Hello! I'm your AI-powered knowledge assistant. Upload a document and I'll help you explore and understand it through natural conversation.
                </div>
            </div>
        </div>
        
        <div class="input-section">
            <div class="input-controls">
                <select id="providerSelect">
                    <option value="openrouter">OpenRouter</option>
                    <option value="groq">Groq</option>
                </select>
                <input type="text" id="queryInput" placeholder="Type your message..." autocomplete="off">
                <button onclick="sendMessage()" id="sendBtn">Send ✨</button>
            </div>
        </div>
    </div>

    <script>
        function updateFileName() {
            const fileInput = document.getElementById('fileInput');
            const label = document.getElementById('uploadLabel');
            if (fileInput.files[0]) {
                label.textContent = fileInput.files[0].name;
            }
        }

        async function uploadDocument() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            
            if (!fileInput.files[0]) {
                status.innerHTML = '<span class="error">Please select a file first</span>';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            status.innerHTML = 'Uploading and processing...';
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                status.innerHTML = `<span class="success">✓ ${result.message}</span>`;
                addMessage('assistant', `📚 Document "${fileInput.files[0].name}" uploaded successfully! I'm now ready to answer your questions about it.`);
            } catch (error) {
                status.innerHTML = '<span class="error">✗ Error uploading file</span>';
            }
        }
        
        async function sendMessage() {
            const queryInput = document.getElementById('queryInput');
            const providerSelect = document.getElementById('providerSelect');
            const sendBtn = document.getElementById('sendBtn');
            const query = queryInput.value.trim();
            
            if (!query) {
                return;
            }
            
            // Add user message to chat
            addMessage('user', query);
            queryInput.value = '';
            
            // Show typing indicator
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.textContent = 'AI is thinking...';
            document.getElementById('chatContainer').appendChild(typingIndicator);
            scrollToBottom();
            
            // Disable send button
            sendBtn.disabled = true;
            
            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        query: query,
                        provider: providerSelect.value
                    })
                });
                const result = await response.json();
                
                // Remove typing indicator
                typingIndicator.remove();
                
                // Add AI response to chat
                addMessage('assistant', result.answer);
            } catch (error) {
                typingIndicator.remove();
                addMessage('assistant', '😔 Sorry, I encountered an error processing your request. Please try again.');
            }
            
            // Re-enable send button
            sendBtn.disabled = false;
            queryInput.focus();
        }

        function addMessage(role, content) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (role === 'assistant') {
                contentDiv.innerHTML = marked.parse(content);
            } else {
                contentDiv.textContent = content;
            }
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        document.getElementById('queryInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
