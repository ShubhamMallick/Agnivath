<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Lead Qualification Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <h1>🎯 Sales Lead Qualification Assistant</h1>
        <p>AI-powered lead processing and qualification</p>
    </div>
    
    <div class="main-container">
        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card high">
                <div class="stat-value" id="highCount">0</div>
                <div class="stat-label">High Priority</div>
            </div>
            <div class="stat-card medium">
                <div class="stat-value" id="mediumCount">0</div>
                <div class="stat-label">Medium Priority</div>
            </div>
            <div class="stat-card low">
                <div class="stat-value" id="lowCount">0</div>
                <div class="stat-label">Low Priority</div>
            </div>
            <div class="stat-card total">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total Leads</div>
            </div>
        </div>
        
        <!-- Lead Form Section -->
        <div class="form-section">
            <h3>📝 Add New Lead</h3>
            <form id="leadForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="phone">
                    </div>
                    <div class="form-group">
                        <label>Company *</label>
                        <input type="text" id="company" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Job Title *</label>
                        <input type="text" id="job_title" required>
                    </div>
                    <div class="form-group">
                        <label>Source *</label>
                        <select id="source" required>
                            <option value="">Select source</option>
                            <option value="Website Contact Form">Website Contact Form</option>
                            <option value="Request Demo">Request Demo</option>
                            <option value="Pricing Page">Pricing Page</option>
                            <option value="Resource Download">Resource Download</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Message *</label>
                    <textarea id="message" rows="4" required placeholder="Enter the lead's message..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>LLM Provider *</label>
                        <select id="provider" required>
                            <option value="groq">Groq (Fast, Free)</option>
                            <option value="openrouter">OpenRouter (Premium Models)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Language</label>
                        <select id="language">
                            <option value="English">English</option>
                            <option value="Hindi">Hindi</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Process Lead ✨</button>
            </form>
        </div>
        
        <!-- Leads List Section -->
        <div class="leads-section">
            <div class="section-header">
                <h3>📊 Qualified Leads</h3>
                <div class="filters">
                    <select id="priorityFilter" onchange="filterLeads()">
                        <option value="all">All Priorities</option>
                        <option value="HIGH">High Priority</option>
                        <option value="MEDIUM">Medium Priority</option>
                        <option value="LOW">Low Priority</option>
                    </select>
                    <button onclick="loadLeads()" class="refresh-btn">Refresh</button>
                </div>
            </div>
            <div id="leadsList" class="leads-list">
                <div class="empty-state">
                    <p>No leads yet. Add a lead above to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let leads = [];
        
        // Load leads on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadLeads();
        });
        
        // Handle form submission
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const leadData = {
                lead_id: 'L' + Date.now(),
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                job_title: document.getElementById('job_title').value,
                message: document.getElementById('message').value,
                source: document.getElementById('source').value,
                language: document.getElementById('language').value,
                provider: document.getElementById('provider').value
            };
            
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            try {
                const response = await fetch('/api/leads/ingest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leadData)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert(`Lead processed successfully!\n\nProvider: ${result.provider_used}\nPriority: ${result.qualification.priority}\nScore: ${result.qualification.score}`);
                    document.getElementById('leadForm').reset();
                    loadLeads();
                } else {
                    alert('Error processing lead: ' + JSON.stringify(result));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
            
            submitBtn.disabled = false;
            submitBtn.textContent = 'Process Lead ✨';
        });
        
        // Load leads from API
        async function loadLeads() {
            try {
                const response = await fetch('/api/leads/list');
                const data = await response.json();
                leads = data.leads || [];
                renderLeads(leads);
                updateStats(leads);
            } catch (error) {
                console.error('Error loading leads:', error);
            }
        }
        
        // Filter leads by priority
        function filterLeads() {
            const filter = document.getElementById('priorityFilter').value;
            if (filter === 'all') {
                renderLeads(leads);
            } else {
                const filtered = leads.filter(lead => lead.qualification.priority === filter);
                renderLeads(filtered);
            }
        }
        
        // Render leads list
        function renderLeads(leadsToRender) {
            const container = document.getElementById('leadsList');
            
            if (leadsToRender.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No leads found.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = leadsToRender.map(lead => `
                <div class="lead-card priority-${lead.qualification.priority.toLowerCase()}">
                    <div class="lead-header">
                        <div class="lead-info">
                            <h4>${lead.extracted_info.name}</h4>
                            <p>${lead.extracted_info.company} - ${lead.extracted_info.job_title}</p>
                        </div>
                        <div class="lead-score">
                            <span class="score-badge priority-${lead.qualification.priority.toLowerCase()}">
                                ${lead.qualification.priority}
                            </span>
                            <span class="score-value">${lead.qualification.score}/100</span>
                        </div>
                    </div>
                    <div class="lead-details">
                        <p><strong>Email:</strong> ${lead.extracted_info.email}</p>
                        <p><strong>Product Interest:</strong> ${lead.extracted_info.product_interest || 'Not specified'}</p>
                        <p><strong>Timeline:</strong> ${lead.extracted_info.timeline || 'Not specified'}</p>
                        <p><strong>Budget:</strong> ${lead.extracted_info.budget || 'Not specified'}</p>
                    </div>
                    <div class="lead-reasons">
                        <strong>Reasons:</strong>
                        <ul>
                            ${lead.qualification.reasons.map(reason => `<li>${reason}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="lead-action">
                        <strong>Next Action:</strong> ${lead.qualification.next_action}
                    </div>
                    ${lead.notification_sent ? '<div class="notification-badge">🔔 Notification Sent</div>' : ''}
                </div>
            `).join('');
        }
        
        // Update statistics
        function updateStats(leadsList) {
            const high = leadsList.filter(l => l.qualification.priority === 'HIGH').length;
            const medium = leadsList.filter(l => l.qualification.priority === 'MEDIUM').length;
            const low = leadsList.filter(l => l.qualification.priority === 'LOW').length;
            
            document.getElementById('highCount').textContent = high;
            document.getElementById('mediumCount').textContent = medium;
            document.getElementById('lowCount').textContent = low;
            document.getElementById('totalCount').textContent = leadsList.length;
        }
    </script>
</body>
</html>
